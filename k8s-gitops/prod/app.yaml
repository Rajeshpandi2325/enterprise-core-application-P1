apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: apps-space
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: mock-api-engine
        image: rajeshpandi/realtime-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_ENV
          value: "prod"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: connection_string
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: apps-space
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: apps-space
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: web-ui
        image: rajeshpandi/realtime-frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: APP_ENV
          value: "prod"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: apps-space
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
